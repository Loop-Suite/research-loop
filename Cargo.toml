[package]
name = "research-loop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "research"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
regex = "1"
